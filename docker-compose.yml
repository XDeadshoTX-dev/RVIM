version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_management
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: TodoPass2026!
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: todo_management
      DB_USER: todo_user
      DB_PASSWORD: TodoPass2026!
      DB_PORT: "3306"
      DEBUG: "True"
      SECRET_KEY: "docker-secret-key-for-demo-only"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Спрощена команда: тільки міграції і запуск сервера (без collectstatic, щоб уникнути крашів)
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    ports:
      - "4555:80"
    depends_on:
      - backend

volumes:
  mysql_data: